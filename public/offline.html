<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Offline — MediFlow</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f766e;
    color: #fff;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    text-align: center;
    padding: 2rem;
    max-width: 420px;
    width: 100%;
  }
  .logo { font-size: 2rem; font-weight: 700; margin: 0 0 1rem; letter-spacing: 1px; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.5rem; opacity: .9; line-height: 1.5; }
  .retry {
    background: #fff;
    color: #0f766e;
    border: 0;
    border-radius: 8px;
    padding: .75rem 1.5rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .retry:hover { opacity: .9; }
  .links { margin-top: 1.5rem; font-size: .9rem; }
  .links a { color: rgba(255,255,255,.85); text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">MediFlow</div>
    <h1>You are offline</h1>
    <p>Your connection was lost. Reconnect and press retry to continue using MediFlow.</p>
    <button class="retry" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
